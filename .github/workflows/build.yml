# Ava — build workflow
# ---------------------------------------------------------------------------
# DELIVERY RULE: the person downloading must get ONE zip that opens on the
# first double-click. GitHub always wraps an artifact in a zip named after the
# artifact, so nothing user-facing is published as an artifact at all — the
# app is published as a RELEASE ASSET, which downloads as the file itself.
# The two artifacts below are internal plumbing (1-day retention) that only
# carry the zips to the release job.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Versions (diagnostic)
        run: |
          set -x
          python --version
          pip --version
          sw_vers
          uname -m

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      # build.spec needs icon.icns on macOS, and the repo carries only
      # icon.png / icon.ico — so the .icns is generated here from icon.png.
      - name: Create icon.icns from icon.png
        run: |
          set -euo pipefail
          if [ -f icon.icns ]; then
            echo "icon.icns already in the repo — using it"
          else
            rm -rf icon.iconset && mkdir icon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
              d=$((s * 2))
              sips -z $d $d icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
            done
            iconutil -c icns icon.iconset -o icon.icns
            rm -rf icon.iconset
          fi
          ls -la icon.icns

      - name: Build
        run: |
          set -euo pipefail
          pyinstaller build.spec --noconfirm

      - name: Show what was built (diagnostic)
        if: always()
        run: ls -la dist || true

      - name: Read build number
        id: v
        run: |
          set -euo pipefail
          N=$(grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')
          echo "build number: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Package with ditto
        run: |
          set -euo pipefail
          Z="Ava-macOS-v${{ steps.v.outputs.n }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Avaye Javid Shah.app" "$Z"
          ls -lh "$Z"

      # Prove the package is sound BEFORE it is published: file type, zip
      # integrity, and a real test-expansion with Apple's own extractor.
      - name: Verify the package
        run: |
          set -euo pipefail
          Z="Ava-macOS-v${{ steps.v.outputs.n }}.zip"
          file "$Z"
          shasum -a 256 "$Z"
          unzip -t "$Z" > /dev/null && echo "zip integrity OK"
          rm -rf _verify && mkdir _verify
          ditto -x -k "$Z" _verify
          test -x "_verify/Avaye Javid Shah.app/Contents/MacOS/Avaye Javid Shah"
          echo "expanded cleanly, main binary present and executable"
          rm -rf _verify

      - uses: actions/upload-artifact@v4
        with:
          name: release-payload-mac
          path: Ava-macOS-v${{ steps.v.outputs.n }}.zip
          retention-days: 1
          compression-level: 0

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller build.spec --noconfirm

      - name: Show what was built (diagnostic)
        if: always()
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Mode, Length, Name

      - name: Read build number
        id: v
        shell: bash
        run: |
          set -euo pipefail
          N=$(grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')
          echo "build number: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Avaye Javid Shah" -DestinationPath "Ava-Windows-v${{ steps.v.outputs.n }}.zip" -Force
          Get-Item "Ava-Windows-v${{ steps.v.outputs.n }}.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-payload-win
          path: Ava-Windows-v${{ steps.v.outputs.n }}.zip
          retention-days: 1
          compression-level: 0

  # Publishes whatever succeeded. If one platform fails, the other is still
  # released instead of the whole run being wasted.
  release:
    needs: [macos, windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          N=$(grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-payload-*
          merge-multiple: true
          path: .
        continue-on-error: true
      - name: What will be released
        run: ls -lh *.zip || { echo "no packages were produced"; exit 1; }

      # the artifact round-trip is the only place the bytes could change
      # between building and publishing — verify them here too.
      - name: Verify the packages that are about to be published
        run: |
          set -euo pipefail
          for z in *.zip; do
            echo "--- $z"
            file "$z"
            shasum -a 256 "$z"
            unzip -t "$z" > /dev/null && echo "    integrity OK"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: نسخهٔ ${{ steps.v.outputs.n }}
          files: "*.zip"
          body: |
            دانلود مستقیم — یک فایل، یک‌بار دوبار-کلیک.
