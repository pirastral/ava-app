# Ava — build workflow
# ---------------------------------------------------------------------------
# DELIVERY MODEL, final form:
#   * TWO download paths, neither ever nested:
#       Actions -> Artifacts -> Ava-macOS  -> expand -> ONE .dmg file
#       Releases -> نسخهٔ NN -> Ava-macOS-vNN.dmg  (no wrapper at all)
#     RULE: an artifact must never contain a zip, because GitHub already
#     wraps every artifact in one. That nesting was introduced by mistake.
#   * macOS ships as a .dmg — the format macOS is built to open. Double-click
#     mounts it, drag the app to Applications. Archive Utility is never
#     involved, so "unsupported format" cannot happen.
#   * Windows ships as a plain zip, which Windows opens natively.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Versions (diagnostic)
        run: |
          set -x
          python --version
          sw_vers
          uname -m

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      # build.spec needs icon.icns on macOS and the repo carries only
      # icon.png / icon.ico, so the .icns is generated here.
      - name: Create icon.icns from icon.png
        run: |
          set -euo pipefail
          if [ ! -f icon.icns ]; then
            rm -rf icon.iconset && mkdir icon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
              d=$((s * 2))
              sips -z $d $d icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
            done
            iconutil -c icns icon.iconset -o icon.icns
            rm -rf icon.iconset
          fi
          ls -la icon.icns

      - name: Build
        run: |
          set -euo pipefail
          pyinstaller build.spec --noconfirm
          ls -la dist

      - name: Read build number
        id: v
        run: |
          set -euo pipefail
          N=$(grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')
          echo "build number: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Build the disk image
        run: |
          set -euo pipefail
          D="Ava-macOS-v${{ steps.v.outputs.n }}.dmg"
          rm -rf dmgroot && mkdir dmgroot
          cp -R "dist/Avaye Javid Shah.app" dmgroot/
          ln -s /Applications "dmgroot/Applications"
          hdiutil create -volname "Avaye Javid Shah" -srcfolder dmgroot \
                         -ov -format UDZO "$D"
          ls -lh "$D"

      # Prove the image mounts and the app inside it is intact, BEFORE release
      - name: Verify the disk image
        run: |
          set -euo pipefail
          D="Ava-macOS-v${{ steps.v.outputs.n }}.dmg"
          hdiutil verify "$D"
          hdiutil attach "$D" -nobrowse -readonly -mountpoint /tmp/avachk
          test -x "/tmp/avachk/Avaye Javid Shah.app/Contents/MacOS/Avaye Javid Shah"
          echo "mounted OK, app present and executable"
          hdiutil detach /tmp/avachk

      # ARTIFACT — the familiar path: Actions -> Artifacts -> Ava-macOS.
      # It holds ONE file, the .dmg. Expand it, double-click the .dmg, drag
      # the app to Applications. No zip inside a zip, ever again.
      - uses: actions/upload-artifact@v4
        with:
          name: Ava-macOS
          path: Ava-macOS-v${{ steps.v.outputs.n }}.dmg
          compression-level: 0

      # RELEASE — the one-step path: the .dmg downloads as itself, no wrapper.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: نسخهٔ ${{ steps.v.outputs.n }}
          files: Ava-macOS-v${{ steps.v.outputs.n }}.dmg
          body: |
            مک: فایل .dmg را باز کنید و برنامه را به پوشهٔ Applications بکشید.
            ویندوز: فایل .zip را باز کنید و پوشه را هرجا می‌خواهید بگذارید.

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller build.spec --noconfirm

      - name: Read build number
        id: v
        shell: bash
        run: |
          set -euo pipefail
          N=$(grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Avaye Javid Shah" -DestinationPath "Ava-Windows-v${{ steps.v.outputs.n }}.zip" -Force
          Get-Item "Ava-Windows-v${{ steps.v.outputs.n }}.zip" | Select-Object Name, Length

      # ARTIFACT — Actions -> Artifacts -> Ava-Windows holds the program
      # folder itself, so expanding it gives the folder directly.
      - uses: actions/upload-artifact@v4
        with:
          name: Ava-Windows
          path: dist/Avaye Javid Shah

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: نسخهٔ ${{ steps.v.outputs.n }}
          files: Ava-Windows-v${{ steps.v.outputs.n }}.zip
