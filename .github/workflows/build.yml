# >>> THIS FILE GOES IN THE REPO AT:  .github/workflows/build.yml  (UPDATED in 158 — replace the copy in the repo)
# 155: protected builds — the app's own code is compiled to native machine code, the bundled keys are
# sealed inside it, each copy you give someone carries its opaque copy id, and a gate refuses to publish
# an app that still contains readable source or plain keys. Run it by hand with a copy id for a recipient.

# Ava — build workflow
# ---------------------------------------------------------------------------
# DELIVERY MODEL, final form:
#   RULE: an artifact must NEVER contain an archive. GitHub already wraps
#   every artifact in a zip of its own, so anything archived inside it lands
#   as a zip inside a zip. The artifacts here hold the application itself:
#       Actions -> Artifacts -> Ava-macOS  -> expand -> "…app" ready to run
#       Releases -> نسخهٔ NN -> the same app in a ditto zip (permissions and
#       symlinks guaranteed) for sending to someone else.
#   * macOS ships the .app itself inside a ditto zip — standalone, double-
#     click and run, no installer and no disk image.
#   * Windows ships as a plain zip, which Windows opens natively.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      copy_id:
        description: "Copy id for a build you will give someone — opaque, like L-02, never a name. Leave dev for your own build."
        required: false
        default: "dev"

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Versions (diagnostic)
        run: |
          set -x
          python --version
          sw_vers
          uname -m

      - name: Put the Hugging Face token into the app
        shell: bash
        run: |
          if [ -n "${{ secrets.HF_TOKEN }}" ]; then
            printf '%s' "${{ secrets.HF_TOKEN }}" > token.txt
            echo "token.txt written from the HF_TOKEN secret"
          else
            test -s token.txt && echo "using the token.txt committed in the repo"
          fi

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # setuptools 81 removed the pkg_resources internals that
          # PyInstaller's pyi_rth_pkgres runtime hook uses. Upgrading it made
          # every build die at launch with:
          #   AttributeError: module 'pkg_resources' has no attribute 'NullProvider'
          # The original workflow upgraded pip ONLY — restored, and pinned so
          # a future runner image cannot reintroduce it.
          pip install "setuptools<81" wheel
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import setuptools, pkg_resources; print('setuptools', setuptools.__version__); print('NullProvider present:', hasattr(pkg_resources, 'NullProvider'))"

      # 155: PROTECT — compile the app's own code to native machine code, seal the bundled keys
      # into it, stamp the copy id, minify the interface scripts. Nothing readable ships.
      - name: Protect — compile, seal, stamp
        shell: bash
        env:
          COPY_ID: ${{ github.event.inputs.copy_id || 'dev' }}
        run: |
          set -euo pipefail
          pip install "cython>=3.0"
          python tools/protect.py

      # build.spec needs icon.icns on macOS and the repo carries only
      # icon.png / icon.ico, so the .icns is generated here.
      - name: Create icon.icns from icon.png
        run: |
          set -euo pipefail
          if [ ! -f icon.icns ]; then
            rm -rf icon.iconset && mkdir icon.iconset
            for s in 16 32 64 128 256 512; do
              sips -z $s $s icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
              d=$((s * 2))
              sips -z $d $d icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
            done
            iconutil -c icns icon.iconset -o icon.icns
            rm -rf icon.iconset
          fi
          ls -la icon.icns

      - name: Build
        run: |
          set -euo pipefail
          pyinstaller build.spec --noconfirm
          ls -la dist

      # 158: the gate looks INSIDE the app's Python archive (PyInstaller's own viewer) — an
      # uncompiled module would hide there, not as a .py file. Only OUR module names are checked,
      # so library files that happen to be called app.py (pywebview's Android code) don't matter.
      - name: Verify protection — compiled code only, none in the Python archive, no keys
        shell: bash
        run: python tools/verify_protection.py

      # A build that cannot start must never be published. This caught the
      # setuptools/pkg_resources breakage; it stays as a permanent gate.
      - name: Smoke test — the app must actually start
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 1 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          "$BIN" > /tmp/smoke.txt 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "app started and stayed alive"
            kill $PID 2>/dev/null || true
          else
            echo "::error::the built app exits immediately — not publishing it"
            tail -30 /tmp/smoke.txt
            exit 1
          fi

      - name: Read build number
        id: v
        run: |
          set -euo pipefail
          N=$(cat BUILD_NUMBER 2>/dev/null || grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')   # 155: engines.py is compiled away by then
          echo "build number: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"
          C="${{ github.event.inputs.copy_id || 'dev' }}"
          if [ "$C" = "dev" ]; then echo "c=" >> "$GITHUB_OUTPUT"; else echo "c=-$C" >> "$GITHUB_OUTPUT"; fi

      - name: Package the app
        run: |
          set -euo pipefail
          Z="Ava-macOS-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip"
          # Discover the bundle instead of hardcoding its name: the previous
          # workflow said "dist/Ava.app" while build.spec now produces
          # "dist/Avaye Javid Shah.app" — a rename in the spec silently broke
          # packaging. Whatever PyInstaller builds is what gets shipped.
          APP=$(find dist -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "::error::no .app found in dist/"; ls -la dist; exit 1; }
          echo "packaging: $APP"
          # ditto keeps the executable bit and every symlink inside the .app,
          # which is what makes it double-clickable straight after expanding.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$Z"
          ls -lh "$Z"

      - name: Verify the package
        continue-on-error: true
        run: |
          set -euo pipefail
          Z="Ava-macOS-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip"
          unzip -t "$Z" > /dev/null && echo "zip integrity OK"
          rm -rf _v && mkdir _v && ditto -x -k "$Z" _v
          APP=$(find _v -maxdepth 1 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          test -x "$BIN" || { echo "::error::main binary is not executable: $BIN"; exit 1; }
          echo "expands to a runnable .app: $APP"
          rm -rf _v

      # ARTIFACT — the ditto zip, and it MUST be a zip.
      # MEASURED ON A MAC RUNNER (job check-macos-artifact): uploading the
      # .app raw returns "symlinks preserved: 0 of ~700" and "executable bit:
      # NO". GitHub's artifact pipeline dereferences every symlink and strips
      # permissions, which leaves a bundle macOS cannot launch. The ditto zip
      # travels through intact. GitHub's own wrapper around it is unavoidable
      # here — the RELEASE below has no wrapper and is the better download.
      - uses: actions/upload-artifact@v4
        with:
          name: Ava-macOS
          path: Ava-macOS-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip
          compression-level: 0
          retention-days: 30

      - name: Where to download
        run: |
          {
            echo "## دانلود نسخهٔ ${{ steps.v.outputs.n }}"
            echo ""
            echo "**برای مک حتماً از این راه دانلود کنید — یک فایل، بدون لایهٔ اضافه:**"
            echo ""
            echo "[Releases](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.v.outputs.n }}) → \`Ava-macOS-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip\`"
            echo ""
            echo "زیپ را باز کنید → برنامه آمادهٔ اجراست (دوبار-کلیک)."
            echo ""
            echo "_بخش Artifacts پایین همین صفحه، فایل را داخل یک زیپ دیگر می‌گذارد؛_"
            echo "_این کار خودِ گیت‌هاب است، نه تنظیمات برنامه._"
          } >> "$GITHUB_STEP_SUMMARY"

      # RELEASE — the same zip with no wrapper: one download, one double-click.
      # An addition, never a dependency: if publishing a Release fails (repo
      # permissions, tag conflicts), the artifacts above are already uploaded
      # and the build stays green.
      - uses: softprops/action-gh-release@v2
        if: ${{ (github.event.inputs.copy_id || 'dev') == 'dev' }}
        continue-on-error: true
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: نسخهٔ ${{ steps.v.outputs.n }}
          files: Ava-macOS-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip
          body: |
            مک: فایل زیپ را باز کنید و برنامه را دوبار-کلیک کنید.
            اگر مک اجازهٔ اجرا نداد: روی برنامه راست-کلیک کنید و Open را بزنید.

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Put the Hugging Face token into the app
        shell: bash
        run: |
          if [ -n "${{ secrets.HF_TOKEN }}" ]; then
            printf '%s' "${{ secrets.HF_TOKEN }}" > token.txt
            echo "token.txt written from the HF_TOKEN secret"
          else
            test -s token.txt && echo "using the token.txt committed in the repo"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" wheel
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import pkg_resources; print('NullProvider present:', hasattr(pkg_resources, 'NullProvider'))"

      # 155: PROTECT — compile the app's own code to native machine code, seal the bundled keys
      # into it, stamp the copy id, minify the interface scripts. Nothing readable ships.
      - name: Protect — compile, seal, stamp
        shell: bash
        env:
          COPY_ID: ${{ github.event.inputs.copy_id || 'dev' }}
        run: |
          set -euo pipefail
          pip install "cython>=3.0"
          python tools/protect.py

      - name: Build
        run: pyinstaller build.spec --noconfirm

      # 158: the gate looks INSIDE the app's Python archive (PyInstaller's own viewer) — an
      # uncompiled module would hide there, not as a .py file. Only OUR module names are checked,
      # so library files that happen to be called app.py (pywebview's Android code) don't matter.
      - name: Verify protection — compiled code only, none in the Python archive, no keys
        shell: bash
        run: python tools/verify_protection.py

      - name: Read build number
        id: v
        shell: bash
        run: |
          set -euo pipefail
          N=$(cat BUILD_NUMBER 2>/dev/null || grep -m1 -oE 'BUILD = [0-9]+' engines.py | grep -oE '[0-9]+')   # 155: engines.py is compiled away by then
          echo "n=$N" >> "$GITHUB_OUTPUT"
          C="${{ github.event.inputs.copy_id || 'dev' }}"
          if [ "$C" = "dev" ]; then echo "c=" >> "$GITHUB_OUTPUT"; else echo "c=-$C" >> "$GITHUB_OUTPUT"; fi

      - name: Package
        shell: pwsh
        run: |
          $src = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $src) { Write-Error "no build folder found in dist/"; exit 1 }
          Write-Host "packaging: $($src.FullName)"
          Compress-Archive -Path $src.FullName -DestinationPath "Ava-Windows-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip" -Force
          Get-Item "Ava-Windows-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip" | Select-Object Name, Length

      # ARTIFACT — Actions -> Artifacts -> Ava-Windows holds the program
      # folder itself, so expanding it gives the folder directly.
      # Windows has no code signature to preserve, so the program folder can
      # travel raw: staged alone so the download expands to exactly one item.
      - name: Stage the program folder alone
        shell: pwsh
        run: |
          $src = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $src) { Write-Error "no build folder in dist/"; exit 1 }
          Remove-Item stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item $src.FullName -Destination stage -Recurse -Force
          Get-ChildItem stage

      - uses: actions/upload-artifact@v4
        with:
          name: Ava-Windows
          path: stage
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        if: ${{ (github.event.inputs.copy_id || 'dev') == 'dev' }}
        continue-on-error: true
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: نسخهٔ ${{ steps.v.outputs.n }}
          files: Ava-Windows-v${{ steps.v.outputs.n }}${{ steps.v.outputs.c }}.zip

  # Downloads the macOS artifact back out of GitHub and reports exactly what
  # survived the round trip: symlinks, the executable bit, and the code
  # signature. This replaces guessing about what artifacts do to a .app.
  # Runs the built app on a Mac and reports WHY it fails, if it fails.
  # Static checks all pass (binary min-macOS 11.0, bundle complete, mode 0755,
  # token valid), so anything left is launch-time: Gatekeeper or a crash.
  check-macos-artifact:
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ava-macOS
          path: got

      - name: Unpack exactly as a user would
        run: |
          set -euo pipefail
          Z=$(find got -name "*.zip" | head -1)
          ditto -x -k "$Z" out
          ls -la out

      - name: Diagnose the app
        run: |
          set +e
          APP=$(find out -maxdepth 1 -name "*.app" | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          echo "=== structure ==="
          echo "symlinks: $(find "$APP" -type l | wc -l | tr -d ' ')"
          echo "binary  : $([ -x "$BIN" ] && echo executable || echo NOT-EXECUTABLE)"
          echo "min macOS required: $(otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos)"
          echo ""
          echo "=== code signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -8
          echo ""
          echo "=== Gatekeeper assessment (what a downloaded copy faces) ==="
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$APP" 2>/dev/null
          spctl -a -t exec -vvv "$APP" 2>&1 | tail -5
          xattr -dr com.apple.quarantine "$APP"
          echo ""
          echo "=== actually launching it (5s) ==="
          "$BIN" > /tmp/o.txt 2>&1 &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            echo "PROCESS ALIVE -> the app starts fine; any failure on your Mac is Gatekeeper/quarantine"
            kill $PID
          else
            wait $PID; RC=$?
            echo "PROCESS EXITED with code $RC — output follows:"
            cat /tmp/o.txt | tail -40
          fi
